name: Setup Grimoire
description: >-
  Install the grim CLI (Grimoire — the OCI-backed package manager for AI
  skills and rules) on the runner and add it to PATH.
author: grimoire-rs
branding:
  icon: book-open
  color: purple

inputs:
  version:
    description: >-
      grim release to install: `latest`, an exact `vX.Y.Z` tag, or a
      prerelease tag such as `v1.2.3-rc.1`
    required: false
    default: latest
  release-base-url:
    description: >-
      Base URL grim release archives are downloaded from. A mirror must
      serve `<base>/download/<tag>/<asset>` plus the `.sha256` sidecars;
      the `<base>/latest/download/<asset>` redirect is GitHub-specific, so
      pin an exact `version` when pointing at a mirror.
    required: false
    default: https://github.com/grimoire-rs/grimoire/releases
  release-auth-header:
    description: >-
      Optional HTTP header sent with release downloads, e.g.
      "PRIVATE-TOKEN: <your-mirror-token>" for an authenticated mirror.
      Pass a secret via the action's `with:` block.
    required: false
    default: ''

outputs:
  version:
    description: The installed grim version as reported by `grim --version`
    value: ${{ steps.report.outputs.version }}

runs:
  using: composite
  steps:
    - name: Install grim (Linux / macOS)
      if: runner.os != 'Windows'
      shell: bash
      env:
        GRIM_SETUP_VERSION: ${{ inputs.version }}
        GRIM_RELEASE_BASE_URL: ${{ inputs.release-base-url }}
        GRIM_RELEASE_AUTH_HEADER: ${{ inputs.release-auth-header }}
      # $GITHUB_ACTION_PATH is an env var, not a `${{ }}` expression, so no
      # untrusted value is interpolated into this line. Invoked via `bash <path>`
      # so the action tarball need not carry the executable bit.
      run: bash "$GITHUB_ACTION_PATH/.github/scripts/install.sh"

    - name: Install grim (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        GRIM_SETUP_VERSION: ${{ inputs.version }}
        GRIM_RELEASE_BASE_URL: ${{ inputs.release-base-url }}
        GRIM_RELEASE_AUTH_HEADER: ${{ inputs.release-auth-header }}
      # `pwsh -NoProfile -File`, not `& <path>`: `exit N` inside a script invoked
      # with the call operator ends that script, not the step. A child process's
      # code lands in $LASTEXITCODE, which the pwsh step wrapper propagates — and
      # it makes the tested path identical to the shipped one.
      run: pwsh -NoProfile -File "$env:GITHUB_ACTION_PATH/.github/scripts/install.ps1"

    - name: Report installed version
      id: report
      shell: bash
      run: |
        set -euo pipefail
        version="$(grim --version)"
        echo "version=${version}" >>"$GITHUB_OUTPUT"
        echo "installed: ${version}"
