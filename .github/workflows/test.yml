name: test

on:
  push:
    branches: [main]
    paths-ignore: [site/**]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  dco:
    name: DCO Sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check sign-off
        # SHAs via env, not inline interpolation into the run: line.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/dco.sh "$BASE_SHA..$HEAD_SHA"

  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./
        with:
          # Exercises the mirror-input plumbing with the canonical default.
          release-base-url: https://github.com/grimoire-rs/grimoire/releases
      - name: grim runs
        shell: bash
        run: |
          set -euo pipefail
          grim --version
          echo "reported: ${{ steps.setup.outputs.version }}"
